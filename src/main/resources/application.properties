spring.application.name=ews

# Server Configuration
server.port=8015

# Tomcat (HTTP layer) - sized for 100+ concurrent requests
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=1000
server.tomcat.accept-count=200
# How long to wait for the client to send request data (not processing time)
server.tomcat.connection-timeout=120s
server.tomcat.keep-alive-timeout=120s

# Async/streaming endpoints (DeferredResult, Callable, SSE): 10 min
spring.mvc.async.request-timeout=600000

# Java 21 virtual threads for request handling
spring.threads.virtual.enabled=true


#ENV based
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

