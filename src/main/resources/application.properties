spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
# Wait up to 60s for a free connection before failing
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=120000
# Oracle JDBC: long socket read timeout for slow queries (ms)
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=600000
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=10000

# Default max seconds for any @Transactional method
spring.transaction.default-timeout=600

# HTTP response compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# Redis Properties
# Use 127.0.0.1 to avoid Windows IPv6->IPv4 fallback delay on 'localhost'
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
# Short enough to fail fast if Redis is down, long enough to survive bursts of concurrent calls
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2s
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
